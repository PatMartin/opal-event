          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '500':
          $ref: '#/components/responses/OperationFailed'
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    delete:
