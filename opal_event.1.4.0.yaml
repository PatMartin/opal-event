      tags:
      - backup
      operationId: post_api_v1_backup_import
      summary: Import portable configuration
      description: Validate backup, replace portable rules/actions/settings atomically and persist to YAML.
        Retains local network/security/database settings. Requires revision precondition to avoid racing file
        edits. No action runs merely from import. No automatic files or scripts are installed.
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupImportRequest'
      responses:
        '200':
          description: Backup applied atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupImportResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
        '500': *id006
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Optional only on loopback. Required on non-loopback interfaces; configured via token_env.
  parameters:
    OpalSessionIdHeader:
      name: X-Opal-Session-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalTransactionIdHeader:
      name: X-Opal-Transaction-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalRequestIdHeader:
      name: X-Opal-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalCausationIdHeader:
      name: X-Opal-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
  schemas:
    EventInput:
      type: object
      description: Minimal event envelope. id/source/timestamp filled for REST ingress if missing; direct ZeroMQ
        producers remain unmodified.
      properties:
        id: &id007
          type: string
          format: uuid
        topic: &id008
          type: string
          pattern: ^[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)*$
          maxLength: 255
        source: &id009
          type: string
          minLength: 1
          maxLength: 128
        timestamp: &id010
          type: string
          format: date-time
        data: &id011
          description: Any JSON value, including arrays and primitives
      additionalProperties: false
      required:
      - topic
      - data
      example:
        topic: intent.recognized
        data:
          intent: lights.turn_on
          confidence: 0.96
    Event:
      type: object
      description: Normalized event as known to REST or internal observer.
      properties:
        id: *id007
        topic: *id008
        source: *id009
        timestamp: *id010
        data: *id011
      additionalProperties: false
      required:
      - id
      - topic
      - source
      - timestamp
      - data
    PublishReceipt:
      type: object
      description: Attempted publication receipt; not a subscriber acknowledgement.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - accepted
        published_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - status
      - published_at
    Condition:
      type: object
      description: Single stateless path predicate. Paths are dotted fields relative to normalized event; array
        indices may be numeric segments. Missing path false except exists with value=false.
      properties:
        path:
          type: string
          example: data.confidence
        operator:
          type: string
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          - in
          - not_in
          - exists
          - contains
        value: *id011
      additionalProperties: false
      required:
      - path
      - operator
      - value
    Rule:
      type: object
      description: Rule resource persisted in YAML. Suffix .* permits hierarchical prefix matching; simple
        AND conditions only.
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
        enabled:
          type: boolean
          default: true
        topic:
          type: string
          example: vision.*
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        actions:
          type: array
          items:
            type: string
            minLength: 1
      additionalProperties: false
      required:
      - id
      - enabled
      - topic
      - conditions
      - actions
      example:
        id: front_door_alert
        enabled: true
        topic: vision.*
        conditions:
        - path: data.object
          operator: eq
          value: person
        actions:
        - announce_person
        - send_notification
    ShellAction:
      type: object
      description: Static executable and argv with optional explicit interpreter. For interpreter modes script_path
        is required; templated user data belongs in args/stdin, not arbitrary executable code.
      properties:
        id:
          type: string
        type:
          const: shell
        enabled:
          type: boolean
          default: true
        mode:
          type: string
          enum:
          - exec
          - sh
          - bash
          - cmd
          - powershell
        executable:
          type: string
          description: Required for mode=exec; absolute registered executable path.
        script_path:
          type: string
          description: Required for interpreter modes; static allowlisted script file path.
        args:
          type: array
          items:
            type: string
          default: []
        stdin:
          type: string
          enum:
          - event_json
          - none
          default: event_json
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      required:
      - id
      - type
      - enabled
      - mode
      allOf:
      - if:
          properties:
            mode:
              const: exec
        then:
          required:
          - executable
      - if:
          properties:
            mode:
              enum:
              - sh
              - bash
              - cmd
              - powershell
        then:
          required:
          - script_path
      example:
        id: announce_person
        type: shell
        enabled: true
        mode: bash
        script_path: /opt/opal/scripts/announce.sh
        args:
        - '{{data.camera}}'
        stdin: event_json
        timeout_seconds: 30
    HttpAction:
      type: object
      description: HTTP request. Scheme/host/port must be fixed and allowlisted; only path/query/body/headers
        may be templated, never authorization header from event values.
      properties:
        id:
          type: string
        type:
          const: http
        enabled:
          type: boolean
          default: true
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        body: *id011
        body_mode:
          type: string
          enum:
          - template
          - event_json
          - none
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      required:
      - id
      - type
      - enabled
      - method
      - url
      - body_mode
      example:
        id: send_notification
        type: http
        enabled: true
        method: POST
        url: http://127.0.0.1:9000/notify
        body_mode: template
        body:
          camera: '{{data.camera}}'
          event: '{{event}}'
        timeout_seconds: 15
    PythonAction:
      type: object
      description: Registered module/function executed in a new Python subprocess. JSON stdin includes normalized
        event, JSON stdout is optional result.
      properties:
        id:
          type: string
        type:
          const: python
        enabled:
          type: boolean
          default: true
        module:
          type: string
          pattern: ^[a-zA-Z_]\w*(\.[a-zA-Z_]\w*)*$
        function:
          type: string
          pattern: ^[a-zA-Z_]\w*$
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      required:
      - id
      - type
      - enabled
      - module
      - function
      example:
        id: process_detection
        type: python
        enabled: true
        module: opal_plugins.detection
        function: handle_event
        timeout_seconds: 30
    Action:
      description: Discriminated action definition
      oneOf:
      - $ref: '#/components/schemas/ShellAction'
      - $ref: '#/components/schemas/HttpAction'
      - $ref: '#/components/schemas/PythonAction'
      discriminator:
        propertyName: type
        mapping:
          shell: '#/components/schemas/ShellAction'
          http: '#/components/schemas/HttpAction'
          python: '#/components/schemas/PythonAction'
    Execution:
      type: object
      description: Execution record. One per action dispatched or dropped.
      properties:
        id:
          type: string
        event_id:
          type:
          - string
          - 'null'
        rule_id:
          type:
          - string
          - 'null'
        action_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - timed_out
          - dropped
        trigger:
          type: string
          enum:
          - rule
          - manual
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_ms:
          type:
          - integer
          - 'null'
        exit_code:
          type:
          - integer
          - 'null'
        http_status:
          type:
          - integer
          - 'null'
        stdout:
          type:
          - string
          - 'null'
        stderr:
          type:
          - string
          - 'null'
        result: *id011
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        action_revision:
          type: string
      additionalProperties: false
      required:
      - id
      - action_id
      - status
      - trigger
      - created_at
    ExecutionRequest:
      type: object
      description: Optional manual input. Generated event metadata is normalized; trigger is manual, rule_id=null.
      properties:
        event:
          $ref: '#/components/schemas/EventInput'
      additionalProperties: false
      required:
      - event
    RuleTestInput:
      type: object
      description: Dry run against the normalized event, no action execution.
      properties:
        event:
          $ref: '#/components/schemas/EventInput'
      additionalProperties: false
      required:
      - event
    RuleTestResult:
      type: object
      description: Condition evaluation result.
      properties:
        matched:
          type: boolean
        action_ids:
          type: array
          items:
            type: string
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: false
      required:
      - matched
      - action_ids
      - checks
    ListEvents:
      type: object
      description: Paginated events from SQLite. No delivery guarantee or replay.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - items
      - next_cursor
    ListRules:
      type: object
      description: Cursor-paginated list.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        next_cursor:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - items
      - next_cursor
    ListActions:
      type: object
      description: Cursor-paginated list.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        next_cursor:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - items
      - next_cursor
    ListExecutions:
      type: object
      description: Cursor-paginated list.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
    TopicList:
      type: object
      description: Observed topic names; incomplete when persistence is off.
      properties:
        items:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - items
    Settings:
      type: object
      description: YAML-managed service configuration, including rules and actions. Masked read excludes secrets;
        pending_restart_fields show settings not yet activated.
      properties:
        version:
          const: 1
        server:
          $ref: '#/components/schemas/ServerSettings'
        zeromq:
          $ref: '#/components/schemas/ZeroMqSettings'
        security:
          $ref: '#/components/schemas/SecuritySettings'
        execution:
          $ref: '#/components/schemas/ExecutionSettings'
        persistence:
          $ref: '#/components/schemas/PersistenceSettings'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
      additionalProperties: false
      required:
      - version
      - server
      - zeromq
      - security
      - execution
      - persistence
      - actions
      - rules
    Health:
      type: object
      description: Health including configuration reload status.
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        broker_running:
          type: boolean
        database_ready:
          type: boolean
        pending_restart:
          type: boolean
      additionalProperties: false
      required:
      - status
      - broker_running
      - database_ready
      - pending_restart
    Stats:
      type: object
      description: Counter snapshot since service start.
      properties:
        observed_events:
          type: integer
          minimum: 0
        invalid_events:
          type: integer
          description: Events rejected by the internal observer as invalid.
          minimum: 0
        matched_events:
          type: integer
          minimum: 0
        executions_succeeded:
          type: integer
          minimum: 0
        executions_failed:
          type: integer
          minimum: 0
        executions_dropped:
          type: integer
          minimum: 0
        queue_depth:
          type: integer
          minimum: 0
        active_workers:
          type: integer
          minimum: 0
        rejected_publications:
          type: integer
          description: Publications rejected because the publisher queue was full.
          minimum: 0
      additionalProperties: false
      required:
      - observed_events
      - invalid_events
      - matched_events
      - executions_succeeded
      - executions_failed
      - executions_dropped
      - queue_depth
      - active_workers
      - rejected_publications
    ServerSettings:
      type: object
      additionalProperties: false
      properties:
        host:
          type: string
          default: 127.0.0.1
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8080
      required:
      - host
      - port
    CurveSettings:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
        server_public_key_file:
          type:
          - string
          - 'null'
        server_secret_key_file:
          type:
          - string
          - 'null'
        authorized_client_keys_file:
          type:
          - string
          - 'null'
      required:
      - enabled
    ZeroMqSettings:
      type: object
      additionalProperties: false
      properties:
        publishers:
          type: string
          default: tcp://127.0.0.1:5555
        subscribers:
          type: string
          default: tcp://127.0.0.1:5556
        max_event_bytes:
          const: 1048576
        curve:
          $ref: '#/components/schemas/CurveSettings'
        publisher_queue_size:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
          description: Maximum number of events buffered in memory for ZeroMQ publication.
      required:
      - publishers
      - subscribers
      - max_event_bytes
      - curve
    RestAuthSettings:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
        token_env:
          type: string
          default: OPAL_EVENT_API_TOKEN
      required:
      - enabled
      - token_env
    AllowedHttpDestination:
      type: object
      additionalProperties: false
      properties:
        host:
          type: string
          minLength: 1
        ports:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
        schemes:
          type: array
          items:
            type: string
            enum:
            - http
            - https
      required:
      - host
      - ports
      - schemes
    SecuritySettings:
      type: object
      additionalProperties: false
      properties:
        rest_auth:
          $ref: '#/components/schemas/RestAuthSettings'
        http_action_allowlist:
          type: array
          items:
            $ref: '#/components/schemas/AllowedHttpDestination'
      required:
      - rest_auth
      - http_action_allowlist
    ExecutionSettings:
      type: object
      additionalProperties: false
      properties:
        max_workers:
          type: integer
          minimum: 1
          maximum: 128
          default: 4
        queue_size:
          type: integer
          minimum: 1
          maximum: 100000
          default: 100
        default_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 30
        overflow:
          const: drop_and_log
        retry_enabled:
          const: false
        max_output_bytes:
          type: integer
          minimum: 0
          maximum: 10485760
          default: 65536
      required:
      - max_workers
      - queue_size
      - default_timeout_seconds
      - overflow
      - retry_enabled
      - max_output_bytes
    PersistenceSettings:
      type: object
      additionalProperties: false
      properties:
        database:
          type: string
          minLength: 1
        event_mode:
          type: string
          enum:
          - all
          - matched
          - none
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 7
        execution_history_enabled:
          const: true
      required:
      - database
      - event_mode
      - retention_days
      - execution_history_enabled
    RulePatch:
      type: object
      description: Partial rule update. Omitted properties unchanged; arrays replace in entirety. Identifier
        is immutable.
      properties:
        enabled:
          type: boolean
          default: true
        topic:
          type: string
          example: vision.*
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        actions:
          type: array
          items:
            type: string
            minLength: 1
      additionalProperties: false
      minProperties: 1
    ShellActionPatch:
      type: object
      description: Partial update for existing shell action; ID and type are immutable. Omitted fields unchanged.
      properties:
        enabled:
          type: boolean
          default: true
        mode:
          type: string
          enum:
          - exec
          - sh
          - bash
          - cmd
          - powershell
        executable:
          type: string
          description: Required for mode=exec; absolute registered executable path.
        script_path:
          type: string
          description: Required for interpreter modes; static allowlisted script file path.
        args:
          type: array
          items:
            type: string
          default: []
        stdin:
          type: string
          enum:
          - event_json
          - none
          default: event_json
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      allOf:
      - if:
          properties:
            mode:
              const: exec
        then:
          required:
          - executable
      - if:
          properties:
            mode:
              enum:
              - sh
              - bash
              - cmd
              - powershell
        then:
          required:
          - script_path
      minProperties: 1
    HttpActionPatch:
      type: object
      description: Partial update for existing http action; ID and type are immutable. Omitted fields unchanged.
      properties:
        enabled:
          type: boolean
          default: true
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          description: Any JSON value, including arrays and primitives
        body_mode:
          type: string
          enum:
          - template
          - event_json
          - none
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      minProperties: 1
    PythonActionPatch:
      type: object
      description: Partial update for existing python action; ID and type are immutable. Omitted fields unchanged.
      properties:
        enabled:
          type: boolean
          default: true
        module:
          type: string
          pattern: ^[a-zA-Z_]\w*(\.[a-zA-Z_]\w*)*$
        function:
          type: string
          pattern: ^[a-zA-Z_]\w*$
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      minProperties: 1
    ActionPatch:
      description: Partial update checked against the existing action type; omitted fields unchanged, ID and
        type immutable. Schema uses anyOf because fields common to several action types are valid.
      anyOf:
      - $ref: '#/components/schemas/ShellActionPatch'
      - $ref: '#/components/schemas/HttpActionPatch'
      - $ref: '#/components/schemas/PythonActionPatch'
    PortableSettings:
      type: object
      additionalProperties: false
      description: Portable, non-secret live-adjustable service settings. Network bindings, CURVE credentials,
        bearer tokens, database path, rules, and actions are excluded.
      properties:
        execution:
          $ref: '#/components/schemas/ExecutionSettings'
        persistence:
          $ref: '#/components/schemas/PortablePersistenceSettings'
        max_event_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
          description: Maps to zeromq.max_event_bytes in YAML; ceiling is 1024 KiB (1048576 bytes).
    PortablePersistenceSettings:
      type: object
      additionalProperties: false
      properties:
        event_mode:
          type: string
          enum:
          - all
          - matched
          - none
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 7
        execution_history_enabled:
          const: true
    PortableSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Partial portable settings update. Nested objects replace in entirety; omitted top-level
        sections unchanged.
      properties:
        execution:
          $ref: '#/components/schemas/ExecutionSettings'
        persistence:
          $ref: '#/components/schemas/PortablePersistenceSettings'
        max_event_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
          description: Event size ceiling, limited to 1024 KiB by v1 protocol.
    ConfigBackup:
      type: object
      additionalProperties: false
      required:
      - format_version
      - settings
      - actions
      - rules
      properties:
        format_version:
          type: integer
          const: 1
        settings:
          $ref: '#/components/schemas/PortableSettings'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
      description: Portable backup excludes host-bound endpoints, secrets, filesystem paths to databases, event/execution
        records, and runtime state. Action definitions may contain local executable paths; operators must review
        on import.
    ValidationReport:
      type: object
      additionalProperties: false
      required:
      - valid
      - errors
      - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    BackupImportRequest:
      type: object
      additionalProperties: false
      required:
      - backup
      properties:
        backup:
