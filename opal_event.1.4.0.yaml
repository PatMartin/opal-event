  headers:
    OpalSessionIdHeader:
      description: Effective OPAL session context for this response. Returned when a session identifier is known; conditionally present.
      required: false
      schema:
        type: string
    OpalTransactionIdHeader:
      description: Logical transaction identifier for this exchange. Always returned; generated when the inbound request lacks one.
      required: true
      schema:
        type: string
    OpalRequestIdHeader:
      description: Identifier of this inbound HTTP exchange. Always returned; regenerated for each downstream hop.
      required: true
      schema:
        type: string
    OpalCausationIdHeader:
      description: Immediate parent event/request identifier for this response. Returned when applicable; conditionally present.
      required: false
      schema:
        type: string
x-opal-context-standard:
  version: '1.2'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    propagate:
    - session_id
    - transaction_id
    - request_id
    - causation_id
    metadata_schema_version: '1.0'
    zero_mq_frames: 2
    compatibility: 'metadata_schema_version versions the optional data.metadata block only; the two-frame wire envelope (topic + JSON with topic/data) is unchanged across versions. Consumers extract known correlation keys (session_id, transaction_id, request_id, causation_id) and MUST ignore unknown metadata fields; producers may emit any metadata_schema_version without breaking the wire contract.'
  pagination:
    history: cursor
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  streaming: Include HTTP context headers before bytes; after headers are sent, failures are represented by
    transport-specific terminal events or stream termination; no invented resumability.
