      - Rules
      operationId: delete_api_v1_rules_id
      summary: Delete rule
      description: ''
      responses:
        '204':
          description: Successful operation
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
