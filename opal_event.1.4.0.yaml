          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '500':
          $ref: '#/components/responses/OperationFailed'
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    delete:
      tags:
      - Events
      operationId: delete_api_v1_events_id
      summary: Delete stored event
      description: Delete an individual event given its ID.
      responses:
        '204':
          description: Successful operation
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '500':
          $ref: '#/components/responses/OperationFailed'
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/topics/:
    get:
      tags:
      - Topics
      operationId: get_api_v1_topics
      summary: List observed topics
      description: '

        Return the complete bounded configuration collection; pagination is not supported. An implementation
        may reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '500':
          $ref: '#/components/responses/OperationFailed'
      parameters: []
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/rules/:
    get:
      tags:
      - Rules
      operationId: get_api_v1_rules
      summary: List rules
      description: '

        Return the complete bounded configuration collection; pagination is not supported. An implementation
        may reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRules'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
