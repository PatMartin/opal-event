      post:
        group: service
        command: start
  /api/v1/service/stop:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/service_stop'
    x-opal-cli:
      post:
        group: service
        command: stop
  /api/v1/service/log:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/service_log'
    x-opal-cli:
      get:
        group: service
        command: log
  /api/v1/persona/:
    get:
      tags:
      - persona
      summary: List Personas
      description: List registered OPAL persona. A persona is a named automation identity so rules and actions attribute work to a consistent character; may bind an OPAL Say voice identifier for spoken notifications. Return the complete bounded configuration collection; pagination is not supported.
      operationId: opal_persona_list
      parameters:
      - name: enabled
        in: query
        required: false
        description: If supplied, filter by enabled state.
        schema:
          type: boolean
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Registered persona.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonaRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string

        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
    post:
      tags:
      - persona
      summary: Create Persona
      description: Register a persona. If `voice_id` is supplied, it names an OPAL Say voice identifier; this service does not validate voice existence locally. Strong If-Match is mandatory.
      operationId: opal_persona_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaCreate'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '201':
          description: Persona created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            Location:
              description: Resource URL
              schema:
                type: string
        '409':
          description: The requested `persona_id` is already registered.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'

        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IfMatch'
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/persona/{persona_id}/validate:
    post:
      summary: Validate Persona
      description: Check that a persona is registered and enabled and that its declared bindings can be resolved.
      operationId: opal_persona_validate
      tags:
      - persona
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '200':
          description: Persona validation report.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalValidationReport'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'

        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
    parameters:
    - $ref: '#/components/parameters/PersonaId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/persona/{persona_id}:
    parameters:
    - $ref: '#/components/parameters/PersonaId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - persona
      summary: Get Persona
      description: Return one registered persona.
      operationId: opal_persona_get
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string

        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
    patch:
      tags:
      - persona
      summary: Update Persona
      description: Partially update a persona.
      operationId: opal_persona_patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaUpdate'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Updated persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'

        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IfMatch'
    delete:
      tags:
      - persona
      summary: Delete Persona
      description: Remove a persona registration. Strong If-Match is mandatory.
      operationId: opal_persona_delete
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '204':
          description: Persona removed.
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'

        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IfMatch'
components:
  parameters:
    PersonaId:
      $ref: './shared/opal_kernel.yaml#/components/parameters/OpalPersonaIdParameter'
  securitySchemes:
    BearerAuth: {$ref: './shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth'}
  schemas:
    EventInput:
      type: object
      description: Minimal event envelope. id/source/timestamp filled for REST ingress if missing; direct ZeroMQ
        producers remain unmodified.
      properties:
        id: &id007
          type: string
          format: uuid
        topic: &id008
          type: string
          pattern: ^[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)*$
          maxLength: 255
        source: &id009
          type: string
          minLength: 1
          maxLength: 128
        timestamp: &id010
          type: string
          format: date-time
        data: &id011
          description: Any JSON value, including arrays and primitives
      additionalProperties: false
      required:
      - topic
      - data
      example:
        topic: intent.recognized
        data:
          intent: lights.turn_on
          confidence: 0.96
    Event:
      type: object
      description: Normalized event as known to REST or internal observer.
      properties:
        id: *id007
        topic: *id008
        source: *id009
        timestamp: *id010
        data: *id011
      additionalProperties: false
      required:
      - id
      - topic
      - source
      - timestamp
      - data
    PublishReceipt:
      type: object
      description: Attempted publication receipt; not a subscriber acknowledgement.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - accepted
        published_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - status
      - published_at
    Condition:
      type: object
      description: Single stateless path predicate. Paths are dotted fields relative to normalized event; array
        indices may be numeric segments. Missing path false except exists with value=false.
      properties:
        path:
          type: string
          example: data.confidence
        operator:
          type: string
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          - in
          - not_in
          - exists
          - contains
        value: *id011
      additionalProperties: false
      required:
      - path
      - operator
      - value
    Rule:
      type: object
      description: Rule resource persisted in YAML. Suffix .* permits hierarchical prefix matching; simple
        AND conditions only.
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
        enabled:
          type: boolean
          default: true
        topic:
          type: string
          example: vision.*
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        actions:
          type: array
          items:
            type: string
            minLength: 1
      additionalProperties: false
      required:
      - id
      - enabled
      - topic
      - conditions
      - actions
      example:
        id: front_door_alert
        enabled: true
        topic: vision.*
        conditions:
        - path: data.object
          operator: eq
          value: person
        actions:
        - announce_person
        - send_notification
    ActionInputSchema:
      type: object
      description: >-
        Optional, self-contained JSON Schema Draft 2020-12 document describing
        the expected JSON value in EventInput.data for this action — nothing
        else. Absent means legacy permissive behavior: event.data is unchecked
        by shape. When declared, EVENT validates event.data against it and
        rejects invalid submissions with the standard 422 error before
        execution, independently of any client-side prevalidation (such as
        OPAL-THINK's); the server is the validating authority. Implementations
        bound schema size/depth and reject remote $ref targets — internal local
        references only — but exact limits are implementation-defined and not
        guaranteed by this schema. Clients such as OPAL-THINK may use this
        metadata to construct arguments. This field does not change the
        EventInput envelope, rule matching, execution authorization, or
        templating, and is not an authorization control. Manual execution (POST
        /actions/{id}/execute) rejects invalid input synchronously with 422; asynchronous
        rule-triggered dispatch instead persists an Execution record with status=dropped and
        error_code=input_validation_failed.
      additionalProperties: true
      example:
        type: object
        properties:
          camera:
            type: string
            description: Camera identifier
        required:
        - camera
    ShellAction:
      type: object
      description: Static executable and argv with optional explicit interpreter. For interpreter modes script_path
        is required; templated user data belongs in args/stdin, not arbitrary executable code.
      properties:
        id:
          type: string
        type:
          const: shell
        enabled:
          type: boolean
          default: true
        description:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Human- and agent-readable purpose, expected effect, and relevant
            constraints. Informational metadata, not an authorization grant.
        input_schema:
          $ref: '#/components/schemas/ActionInputSchema'
        keywords:
          type: array
          description: >-
            Search/discovery hints that help an agent or operator select this
            action. Untrusted informational metadata: never executable
            instructions, not an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
          uniqueItems: true
        suggested_prompts:
          type: array
          description: >-
            Example natural-language prompts that could legitimately lead to
            this action. Untrusted informational metadata: never executable
            instructions, never an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 512
          maxItems: 8
        mode:
          type: string
          enum:
          - exec
          - sh
          - bash
          - cmd
          - powershell
        executable:
          type: string
          description: Required for mode=exec; absolute registered executable path.
        script_path:
          type: string
          description: Required for interpreter modes; static allowlisted script file path.
        args:
          type: array
          items:
            type: string
          default: []
        stdin:
          type: string
          enum:
          - event_json
          - none
          default: event_json
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      required:
      - id
      - type
      - enabled
      - mode
      allOf:
      - if:
          properties:
            mode:
              const: exec
        then:
          required:
          - executable
      - if:
          properties:
            mode:
              enum:
              - sh
              - bash
              - cmd
              - powershell
        then:
          required:
          - script_path
      example:
        id: announce_person
        type: shell
        enabled: true
        description: Announce a person detected by a named camera.
        input_schema:
          type: object
          properties:
            camera:
              type: string
              description: Camera identifier
          required:
          - camera
        mode: bash
        script_path: /opt/opal/scripts/announce.sh
        args:
        - '{{data.camera}}'
        stdin: event_json
        timeout_seconds: 30
    HttpAction:
      type: object
      description: HTTP request. Scheme/host/port must be fixed and allowlisted; only path/query/body/headers
        may be templated, never authorization header from event values.
      properties:
        id:
          type: string
        type:
          const: http
        enabled:
          type: boolean
          default: true
        description:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Human- and agent-readable purpose, expected effect, and relevant
            constraints. Informational metadata, not an authorization grant.
        input_schema:
          $ref: '#/components/schemas/ActionInputSchema'
        keywords:
          type: array
          description: >-
            Search/discovery hints that help an agent or operator select this
            action. Untrusted informational metadata: never executable
            instructions, not an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
          uniqueItems: true
        suggested_prompts:
          type: array
          description: >-
            Example natural-language prompts that could legitimately lead to
            this action. Untrusted informational metadata: never executable
            instructions, never an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 512
          maxItems: 8
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        body: *id011
        body_mode:
          type: string
          enum:
          - template
          - event_json
          - none
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      required:
      - id
      - type
      - enabled
      - method
      - url
      - body_mode
      example:
        id: send_notification
        type: http
        enabled: true
        method: POST
        url: http://127.0.0.1:9000/notify
        body_mode: template
        body:
          camera: '{{data.camera}}'
          event: '{{event}}'
        timeout_seconds: 15
    PythonAction:
      type: object
      description: Registered module/function executed in a new Python subprocess. JSON stdin includes normalized
        event, JSON stdout is optional result.
      properties:
        id:
          type: string
        type:
          const: python
        enabled:
          type: boolean
          default: true
        description:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Human- and agent-readable purpose, expected effect, and relevant
            constraints. Informational metadata, not an authorization grant.
        input_schema:
          $ref: '#/components/schemas/ActionInputSchema'
        keywords:
          type: array
          description: >-
            Search/discovery hints that help an agent or operator select this
            action. Untrusted informational metadata: never executable
            instructions, not an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
          uniqueItems: true
        suggested_prompts:
          type: array
          description: >-
            Example natural-language prompts that could legitimately lead to
            this action. Untrusted informational metadata: never executable
            instructions, never an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 512
          maxItems: 8
        module:
          type: string
          pattern: ^[a-zA-Z_]\w*(\.[a-zA-Z_]\w*)*$
        function:
          type: string
          pattern: ^[a-zA-Z_]\w*$
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
      additionalProperties: false
      required:
      - id
      - type
      - enabled
      - module
      - function
      example:
        id: process_detection
        type: python
        enabled: true
        module: opal_plugins.detection
        function: handle_event
        timeout_seconds: 30
    Action:
      description: Discriminated action definition
      oneOf:
      - $ref: '#/components/schemas/ShellAction'
      - $ref: '#/components/schemas/HttpAction'
      - $ref: '#/components/schemas/PythonAction'
      discriminator:
        propertyName: type
        mapping:
          shell: '#/components/schemas/ShellAction'
          http: '#/components/schemas/HttpAction'
          python: '#/components/schemas/PythonAction'
    Execution:
      type: object
      description: Execution record. One per action dispatched or dropped.
      properties:
        id:
          type: string
        event_id:
          type:
          - string
          - 'null'
        rule_id:
          type:
          - string
          - 'null'
        action_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - timed_out
          - dropped
        trigger:
          type: string
          enum:
          - rule
          - manual
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_ms:
          type:
          - integer
          - 'null'
        exit_code:
          type:
          - integer
          - 'null'
        http_status:
          type:
          - integer
          - 'null'
        stdout:
          type:
          - string
          - 'null'
        stderr:
          type:
          - string
          - 'null'
        result: *id011
        error_code:
          type:
          - string
          - 'null'
          description: Stable machine code for failure classification. input_validation_failed
            means the action was rejected before execution because event.data did not satisfy
            the action's declared input_schema.
        error_message:
          type:
          - string
          - 'null'
          description: Human-readable failure detail; for input_validation_failed, describes
            which field or schema constraint failed.
        action_revision:
          type: string
      additionalProperties: false
      required:
      - id
      - action_id
      - status
      - trigger
      - created_at
    ExecutionRequest:
      type: object
      description: Optional manual input. Generated event metadata is normalized; trigger is manual, rule_id=null.
      properties:
        event:
          $ref: '#/components/schemas/EventInput'
      additionalProperties: false
      required:
      - event
    RuleTestInput:
      type: object
      description: Dry run against the normalized event, no action execution.
      properties:
        event:
          $ref: '#/components/schemas/EventInput'
      additionalProperties: false
      required:
      - event
    RuleTestResult:
      type: object
      description: Condition evaluation result.
      properties:
        matched:
          type: boolean
        action_ids:
          type: array
          items:
            type: string
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: false
      required:
      - matched
      - action_ids
      - checks
    EventList:
      type: array
      items:
        $ref: '#/components/schemas/Event'
      description: Bounded list of stored events, newest first; `limit` caps the returned items. No delivery guarantee or replay.
    RuleList:
      type: array
      items:
        $ref: '#/components/schemas/Rule'
      description: Complete bounded collection.
    ActionList:
      type: array
      items:
        $ref: '#/components/schemas/Action'
      description: Complete bounded collection.
    ExecutionList:
      type: array
      items:
        $ref: '#/components/schemas/Execution'
      description: Bounded list of executions, newest first; `limit` caps the returned items.
    TopicList:
      type: object
      description: Observed topic names; incomplete when persistence is off.
      properties:
        items:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - items
    Stats:
      type: object
      description: Counter snapshot since service start.
      properties:
        observed_events:
          type: integer
          minimum: 0
        invalid_events:
          type: integer
          description: Events rejected by the internal observer as invalid.
          minimum: 0
        matched_events:
          type: integer
          minimum: 0
        executions_succeeded:
          type: integer
          minimum: 0
        executions_failed:
          type: integer
          minimum: 0
        executions_dropped:
          type: integer
          minimum: 0
        queue_depth:
          type: integer
          minimum: 0
        active_workers:
          type: integer
          minimum: 0
        rejected_publications:
          type: integer
          description: Publications rejected because the publisher queue was full.
          minimum: 0
      additionalProperties: false
      required:
      - observed_events
      - invalid_events
      - matched_events
      - executions_succeeded
      - executions_failed
      - executions_dropped
      - queue_depth
      - active_workers
      - rejected_publications
    RulePatch:
      type: object
      description: Partial rule update. Omitted properties unchanged; arrays replace in entirety. Identifier
        is immutable.
      properties:
        enabled:
          type: boolean
          default: true
        topic:
          type: string
          example: vision.*
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        actions:
          type: array
          items:
            type: string
            minLength: 1
      additionalProperties: false
      minProperties: 1
    ShellActionPatch:
      type: object
      description: Partial update for existing shell action; ID and type are immutable. Omitted fields unchanged.
      properties:
        enabled:
          type: boolean
          default: true
        mode:
          type: string
          enum:
          - exec
          - sh
          - bash
          - cmd
          - powershell
        executable:
          type: string
          description: Required for mode=exec; absolute registered executable path.
        script_path:
          type: string
          description: Required for interpreter modes; static allowlisted script file path.
        args:
          type: array
          items:
            type: string
          default: []
        stdin:
          type: string
          enum:
          - event_json
          - none
          default: event_json
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        description:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Human- and agent-readable purpose, expected effect, and relevant
            constraints. Informational metadata, not an authorization grant.
        input_schema:
          $ref: '#/components/schemas/ActionInputSchema'
        keywords:
          type: array
          description: >-
            Search/discovery hints that help an agent or operator select this
            action. Untrusted informational metadata: never executable
            instructions, not an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
          uniqueItems: true
        suggested_prompts:
          type: array
          description: >-
            Example natural-language prompts that could legitimately lead to
            this action. Untrusted informational metadata: never executable
            instructions, never an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 512
          maxItems: 8
      additionalProperties: false
      allOf:
      - if:
          required:
          - mode
          properties:
            mode:
              const: exec
        then:
          required:
          - executable
      - if:
          required:
          - mode
          properties:
            mode:
              enum:
              - sh
              - bash
              - cmd
              - powershell
        then:
          required:
          - script_path
      minProperties: 1
    HttpActionPatch:
      type: object
      description: Partial update for existing http action; ID and type are immutable. Omitted fields unchanged.
      properties:
        enabled:
          type: boolean
          default: true
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          description: Any JSON value, including arrays and primitives
        body_mode:
          type: string
          enum:
          - template
          - event_json
          - none
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        description:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Human- and agent-readable purpose, expected effect, and relevant
            constraints. Informational metadata, not an authorization grant.
        input_schema:
          $ref: '#/components/schemas/ActionInputSchema'
        keywords:
          type: array
          description: >-
            Search/discovery hints that help an agent or operator select this
            action. Untrusted informational metadata: never executable
            instructions, not an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
          uniqueItems: true
        suggested_prompts:
          type: array
          description: >-
            Example natural-language prompts that could legitimately lead to
            this action. Untrusted informational metadata: never executable
            instructions, never an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 512
          maxItems: 8
      additionalProperties: false
      minProperties: 1
    PythonActionPatch:
      type: object
      description: Partial update for existing python action; ID and type are immutable. Omitted fields unchanged.
      properties:
        enabled:
          type: boolean
          default: true
        module:
          type: string
          pattern: ^[a-zA-Z_]\w*(\.[a-zA-Z_]\w*)*$
        function:
          type: string
          pattern: ^[a-zA-Z_]\w*$
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        description:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Human- and agent-readable purpose, expected effect, and relevant
            constraints. Informational metadata, not an authorization grant.
        input_schema:
          $ref: '#/components/schemas/ActionInputSchema'
        keywords:
          type: array
          description: >-
            Search/discovery hints that help an agent or operator select this
            action. Untrusted informational metadata: never executable
            instructions, not an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
          uniqueItems: true
        suggested_prompts:
          type: array
          description: >-
            Example natural-language prompts that could legitimately lead to
            this action. Untrusted informational metadata: never executable
            instructions, never an authorization grant, not a security control.
          items:
            type: string
            minLength: 1
            maxLength: 512
          maxItems: 8
      additionalProperties: false
      minProperties: 1
    ActionPatch:
      description: Partial update checked against the existing action type; omitted fields unchanged, ID and
        type immutable. Schema uses anyOf because fields common to several action types are valid.
      anyOf:
      - $ref: '#/components/schemas/ShellActionPatch'
      - $ref: '#/components/schemas/HttpActionPatch'
      - $ref: '#/components/schemas/PythonActionPatch'
    PersonaCreate:
      $ref: './shared/opal_kernel.yaml#/components/schemas/OpalPersonaCreate'
    PersonaUpdate:
      $ref: './shared/opal_kernel.yaml#/components/schemas/OpalPersonaUpdate'
    PersonaRead:
      $ref: './shared/opal_kernel.yaml#/components/schemas/OpalPersonaRead'
x-opal-context-standard:
  version: '1.2'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    $ref: './shared/opal_kernel.yaml#/x-opal-event-envelope'
    metadata_schema_version: '1.0'
  pagination:
    history: none
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  streaming: Include HTTP context headers before bytes; after headers are sent, failures are represented by
    transport-specific terminal events or stream termination; no invented resumability.
x-opal-authorization:
  version: '1.0'
  description: Least-privilege scope model for EVENT access. BearerAuth authenticates;
    scopes authorize. 401 means missing or invalid credentials; 403 means authenticated
    but insufficient scope. Credentials are supplied via token_env and never appear in
    configuration export, import, backup bundles, or log output.
  scopes:
    actions:read:
      description: Discover registered actions and topics.
      permits:
      - GET /api/v1/action/
      - GET /api/v1/action/{action_id}
      - GET /api/v1/topic/
    actions:execute:
      description: Manually invoke a registered, enabled action.
      permits:
      - POST /api/v1/action/{action_id}/execute
    executions:read:
      description: Inspect execution records, including dropped input-validation failures.
      permits:
      - GET /api/v1/execution/
      - GET /api/v1/execution/{execution_id}
    actions:write:
      description: Create, edit, or delete actions.
      permits:
      - POST /api/v1/action/
      - PATCH /api/v1/action/{action_id}
      - DELETE /api/v1/action/{action_id}
    rules:write:
      description: Create, edit, delete, or test rules.
      permits:
      - POST /api/v1/rule/
      - PATCH /api/v1/rule/{rule_id}
      - DELETE /api/v1/rule/{rule_id}
      - POST /api/v1/rule/{rule_id}/test
    settings:write:
      description: Change settings, credentials, or configuration backups.
      permits:
      - PATCH /api/v1/setting/
      - POST /api/v1/backup/import
  principals:
    think:
      description: OPAL Think's least-privilege principal. Discovers enabled actions,
        invokes permitted actions, and inspects execution results only.
      scopes:
      - actions:read
      - actions:execute
      - executions:read
      denied:
      - actions:write
      - rules:write
      - settings:write
  semantics:
    missing_or_invalid_credentials: '401'
    authenticated_but_insufficient_scope: '403'
    loopback: BearerAuth is optional on loopback interfaces per the security scheme;
      scope enforcement is intended for non-loopback clients. Loopback access is
      administrative and is not a permission-escalation vector.
    credential_handling: Tokens are configured via token_env; no credential material is
      exposed through configuration export/import, backup bundles, or log output.
    authenticated_but_not_permitted: '403'
    credentials: correlation headers are transport context, never authorization credentials
    secrets: secret values must not appear in responses, exports, or error details
    least_privilege: Grant only the scopes a principal needs. A principal holding only
      actions:read, actions:execute, executions:read cannot create/edit/delete actions,
      manage rules, change settings or credentials, escalate its own permissions, or
      bypass endpoint/destination restrictions.
