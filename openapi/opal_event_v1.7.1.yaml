openapi: 3.1.0
info:
  title: Opal Event API
  version: 1.7.1
  description: 'REST management and HTTP event ingress for opal-event-svc. API-first contract, release v1.


    ZeroMQ XSUB/XPUB best-effort transport is separately specified in zeromq_protocol.md.

    REST 202 means accepted for attempted publication or queued execution, NOT delivered/processed.

    The broker forwards opaque frames; REST validates inputs before publication; the internal observer validates
    them independently. Direct producers may forward invalid events to external subscribers.


    Configuration: YAML is authoritative and editable via REST and filesystem. Rules/actions/persistence/worker
    controls can activate without restart. Network listener endpoints, REST authorization settings, CURVE credentials
    and database location changes are saved but pending restart. Pending-restart state is observable through
    health/readiness information. Filesystem changes must be watched, validated and activated atomically; invalid
    files leave last good configuration active and report reload errors. REST edits use optimistic revisions;
    if external edits race, respond 409 and do not overwrite.


    Policy: By default all interfaces bind 127.0.0.1; when bound to non-loopback, REST bearer authentication
    and ZeroMQ CURVE SHALL be enabled. Local default auth can be disabled only on loopback. All configuration
    mutation and manual execution routes are privileged. OpenAPI expresses potential Bearer security; deployment
    can explicitly disable it on loopback. Tokens/secret keys are never returned.


    Execution: four worker slots default, bounded queue, overflow drops with execution record and metrics.
    Independent concurrent actions; no retry, no ordering guarantees. Execution terminal states: succeeded,
    failed, timed_out, dropped. Subprocess groups are terminated on timeout as OS supports. Output capture
    is truncated/redacted; event payloads are untrusted; logging must redact configured secrets.


    Templating: placeholders {{data.path}} or {{event}}. Whole JSON values preserve types; interpolated strings
    stringify values. Missing path causes template_error; no template expressions, evaluation, or control flow.
    Shell executables use argv, never interpolate a command string into a shell. Explicit shell interpreter
    modes require a configured static script/command template and are high-risk; do not concatenate raw event
    values into interpreter code; positional args or stdin preferred. HTTP destinations are verified against
    scheme/host/port allowlist after DNS resolution, on each connection, and redirects are disabled. Template
    expansion must not alter scheme/hostname/port. Python plugins run separately, from registered module +
    function only, with JSON stdin/stdout.


    Rules: enabled exact topic or suffix .* prefix pattern, ANDed conditions, multiple actions independently
    dispatched; no aggregation, timers, rule chains, or state. Prefix vision.* matches vision.foo and deeper
    descendants, not visionary, and not bare vision. Conditions compare strictly typed JSON values; numeric
    comparisons require numbers, missing fields evaluate false except exists(false). Event sizes max 1048576
    bytes per two-frame message (sum of frame payload byte lengths), and same bound on canonical serialized
    REST wire event.


    OPAL shared conventions: /api/v1 prefix; trailing slash on collection roots; 201+Location for resource
    creation; 204 for deletion; PATCH for partial updates; portable settings and backup endpoints. Full config
    PUT remains for complete YAML replacement. Event publication and manual execution retain 202 for best-effort
    admission. This revision introduces breaking path changes from /v1.


    On PATCH /api/v1/settings/, max_event_bytes maps to zeromq.max_event_bytes; portable persistence fields
    map to persistence excluding its database path. PATCH resources do not accept id or type replacement. Changes
    to HTTP or ZeroMQ listener addresses, authentication, keys, or SQLite path are only activated after restart.



    OPAL SUITE STANDARD v1.2 (normative)

    X-Opal-Session-Id is an optional logical context identifier; it does not create a server-managed session
    or grant authorization. Entry-point services generate one when absent where a workflow requires it, and
    propagate it unchanged. A preexisting service-local session resource has a separate lifecycle. X-Opal-Transaction-Id
    is a single logical end-to-end operation and is not an atomic distributed transaction. X-Opal-Request-Id
    identifies one inbound HTTP exchange and is regenerated for each downstream HTTP hop (the incoming one
    can be used for diagnostics); X-Opal-Causation-Id names the immediate parent event/request, where applicable.
    For inbound requests, if a transaction ID is absent the service assigns one; all response types (including
    errors, streamed headers, and binary bodies) return session ID if known and transaction/request IDs. Never
    trust these values for access control. Propagate them into derived ZeroMQ envelope metadata. All identifiers
    are opaque 1..128-character printable ASCII tokens with no control/whitespace characters; client-supplied
    invalid values yield 422.

    Standard health routes: /api/v1/health/, /api/v1/health/live, /api/v1/health/ready. Settings: GET and PATCH
    /api/v1/settings/ exclusively; PATCH is atomic. Mutable configuration uses strong ETags and mandatory If-Match
    with 428 missing, 412 stale. For bounded configuration catalogs return full arrays (subject to explicit
    deployment caps); growing histories return bounded arrays in stable deterministic order and `limit`
    caps the returned items. Standard HTTP creation 201 Location, async admission 202, empty deletion
    204. Streaming keeps media-specific transports but exposes correlation headers, defined failure behavior,
    and no unsupported replay guarantee. Configuration export/import/validation excludes secrets and history.


    v1.4.1 revision: registered actions (shell/http/python) gain optional self-description
    metadata — description, input_schema, keywords, suggested_prompts — with no endpoint,
    discriminator, or required-field changes. Declared input_schema describes EventInput.data
    only and is validated server-side before execution (invalid submissions yield 422);
    the remaining fields are untrusted discovery hints, never authorization or instructions.

    '
  license:
    name: Internal use
servers:
- url: http://127.0.0.1:8080
tags:
- name: Events
- name: Topics
- name: Rules
- name: Actions
- name: Executions
- name: Operations
- name: settings
  description: Portable settings shared across OPAL services.
- name: backup
  description: Validate, import, and export portable configuration.
- name: persona
  description: Manage named persona identities adopting the shared OPAL persona identifiers introduced by OPAL Say v1.6.0.
- name: info
  description: Service identity, version and liveness probes.
- name: service
  description: Service process lifecycle (start, stop, log tail).
security:
- BearerAuth: []
paths:
  /api/v1/event/:
    post:
      tags:
      - Events
      operationId: post_api_v1_events
      summary: Publish event
      description: Normalizes missing metadata, checks 1 MiB serialized wire payload, enqueues publication.
        Rule-triggered dispatch validates event.data against each matched action's optional input_schema;
        on failure the action is not run and no retry occurs; an Execution record is persisted with
        status=dropped, trigger=rule, error_code=input_validation_failed, and error_message describing
        the rejection — observable via GET /api/v1/executions/, never returned to the already-completed
        publisher. Does not guarantee observer storage or action execution. Returns 503 if the publisher
        queue is full.
      responses:
        '202':
          description: Accepted, not guaranteed delivered/executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishReceipt'
              example:
                id: 7fe5d3fa-d326-41fd-9cce-5d76b69a6174
                status: accepted
                published_at: '2026-10-07T21:00:00Z'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '413':
          $ref: './shared/opal_kernel.yaml#/components/responses/PayloadTooLarge'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
    get:
      tags:
      - Events
      operationId: get_api_v1_events
      summary: List stored events
      description: ''
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './shared/opal_kernel.yaml#/components/responses/OperationFailed'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: topic
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    delete:
      tags:
      - Events
      operationId: delete_api_v1_events
      summary: Clear all stored events
      description: Clear all events from all topics.
      responses:
        '204':
          description: Successful operation
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './shared/opal_kernel.yaml#/components/responses/OperationFailed'
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/event/{event_id}:
    get:
      tags:
      - Events
      operationId: get_api_v1_events_id
      summary: Get stored event
      description: ''
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './shared/opal_kernel.yaml#/components/responses/OperationFailed'
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    delete:
      tags:
      - Events
      operationId: delete_api_v1_events_id
      summary: Delete stored event
      description: Delete an individual event given its ID.
      responses:
        '204':
          description: Successful operation
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './shared/opal_kernel.yaml#/components/responses/OperationFailed'
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/topic/:
    get:
      tags:
      - Topics
      operationId: get_api_v1_topics
      summary: List observed topics
      description: '

        Return the complete bounded configuration collection; pagination is not supported. An implementation
        may reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './shared/opal_kernel.yaml#/components/responses/OperationFailed'
      parameters: []
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/rule/:
    get:
      tags:
      - Rules
      operationId: get_api_v1_rules
      summary: List rules
      description: '

        Return the complete bounded configuration collection; pagination is not supported. An implementation
        may reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleList'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './shared/opal_kernel.yaml#/components/responses/OperationFailed'
      parameters: []
    post:
      tags:
      - Rules
      operationId: post_api_v1_rules
      summary: Create rule
      description: ''
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
          headers:
            Location:
              description: Resource URL
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './shared/opal_kernel.yaml#/components/responses/OperationFailed'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      requestBody:
