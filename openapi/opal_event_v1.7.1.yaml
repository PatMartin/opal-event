  /api/v1/action/{action_id}/execute:
    post:
      tags:
      - Actions
      operationId: post_api_v1_actions_id_execute
      summary: Execute registered action manually
      description: Enqueue one independent execution. Queue-full yields execution record status=dropped and
        HTTP 202, never an automatic retry. Registered and enabled action only. When the action declares
        input_schema, event.data is validated synchronously before any execution record is created; invalid
        input returns the standard OpalError 422 response and no execution occurs, unlike the asynchronous
        queue-full path which records status=dropped.
      responses:
        '202':
          description: Accepted, not guaranteed delivered/executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
