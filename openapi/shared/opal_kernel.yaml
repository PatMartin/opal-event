              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
              Location:
                $ref: '#/components/headers/Location'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalBackupCreateResponse'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
          '500':
            $ref: '#/components/responses/OperationFailed'
    backup_list:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      get:
        tags:
        - backup
