                    $ref: '#/components/schemas/OpalBackupInfo'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
    backup_download:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      - $ref: '#/components/parameters/BackupFilename'
      get:
        tags:
        - backup
        summary: Download backup
        operationId: opal_backup_download
        description: Download one service-managed backup archive.
        responses:
          '200':
            description: Backup archive.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
            content:
              application/octet-stream:
