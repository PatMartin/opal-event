                  format: binary
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
    backup_delete:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      - $ref: '#/components/parameters/BackupFilename'
      delete:
        tags:
        - backup
        summary: Delete backup
        operationId: opal_backup_delete
        description: Delete a named backup file managed by this service.
        responses:
          '204':
            description: Backup deleted.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
    backup_export:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      get:
        tags:
        - backup
        summary: Export configuration
        operationId: opal_backup_export
        description: 'Export the full logical service configuration as JSON. The bundle describes portable configuration
          only: it never embeds secrets, binaries, model files, or history.'
        responses:
          '200':
            description: Logical service configuration.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalConfigExport'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
