[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-event"
version = "1.2.0"
description = "OPAL Event: event bus, rule engine and action execution service (opal-event-svc), CLI and SPA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "pyzmq>=25.1",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.21", "ruff>=0.4"]

[project.scripts]
opal = "opal_event.cli.main:app"
opal-event = "opal_event.cli.main:event_app"
opal-event-svc = "opal_event.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opal_event = ["contract/opal_event.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["opal_event", "conftest"]
